# Quality gates (docs/ci.md).
# PRs and pushes to main run the FAST gate: Linux `cargo xtask ci --fast` (fmt, brand, docs, clippy, heif
# clippy, parity, layers, assets, deny, wasm; no unit-test run) plus the SIL suite when it exists; macOS
# and Windows build + clippy only.
# Pushes to `release` and manual dispatch run the FULL gate: `cargo xtask ci` with every test on Linux,
# and the workspace tests on macOS and Windows. FreeBSD has its own workflow (freebsd.yml).
name: CI

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # On main every push keeps its run (a newer push waits behind it), so a run of merges still gets
  # a result; on other refs a newer push replaces the older run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: 1
  # Fonts (optional build input): the CJK font tests run instead of skipping.
  CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
  CRAFT_FONTS_REQUIRED: "1"
  # full test runs only before a release (push to `release`) or on manual dispatch
  FULL_CI: ${{ (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/release') && '1' || '' }}

jobs:
  linux:
    name: Linux (cargo xtask ci)
    # Our own branches run on the maintainer's self-hosted runner (warm build cache, minutes not an
    # hour); PRs from forks never touch it and use a GitHub-hosted runner. See docs/ci.md.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "x64", "lcc"]') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: 8dcdacd5153e64560d109541a47d806f26f048c0 # same pin as release.yml / freebsd.yml
          path: craft-fonts
      - name: Keep the build cache between runs (self-hosted)
        if: runner.environment == 'self-hosted'
        # One cache per runner instance (several can share a machine and run at once); a runner's
        # .env may set CARGO_TARGET_DIR itself.
        run: echo "CARGO_TARGET_DIR=${CARGO_TARGET_DIR:-$HOME/.cache/lcc-ci-target-$RUNNER_NAME}" >> "$GITHUB_ENV"
      - name: Install system libraries
        if: runner.environment != 'self-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libudev-dev
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment != 'self-hosted'
        with:
          key: ci-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-nextest
      # full run (CI=true): the test stage runs cargo-nextest with retries and ci/quarantine.toml (docs/ci.md)
      - name: cargo xtask ci (--fast unless a release / manual run)
        shell: bash
        run: |
          if [ -n "$FULL_CI" ]; then cargo xtask ci; else cargo xtask ci --fast; fi
      # Software-in-the-loop suite (docs/testing-sil.md); skipped until `cargo xtask sil` exists.
      - name: SIL suite
        shell: bash
        run: |
          if grep -q 'Some("sil")' xtask/src/main.rs; then cargo xtask sil; else echo "SIL suite not present yet; skipped"; fi

  test:
    name: ${{ matrix.name }} (clippy + build; tests before a release)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            self_hosted: '["self-hosted", "macOS", "ARM64", "lcc"]'
          - name: Windows
            os: windows-latest
            # the maintainer's self-hosted runner, for our own branches (docs/ci.md)
            self_hosted: '["self-hosted", "windows", "x64", "lcc"]'
    runs-on: ${{ (matrix.self_hosted && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && fromJSON(matrix.self_hosted) || matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: 8dcdacd5153e64560d109541a47d806f26f048c0 # same pin as release.yml / freebsd.yml
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment != 'self-hosted'
        with:
          key: ci-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        if: env.FULL_CI == '1'
        with:
          tool: cargo-nextest
      - name: build
        run: cargo build --workspace --locked
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # nextest with retries; quarantined tests (ci/quarantine.toml) run apart and only warn (docs/ci.md)
      - name: test
        if: env.FULL_CI == '1'
        run: cargo xtask quarantine test
