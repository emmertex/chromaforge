[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# `cargo xtask i18n`: reads catalogs in file order, refusing a repeated key
serde = { workspace = true }
serde_json = { workspace = true }
# release notes: `cargo xtask notes`
lcc-notes = { workspace = true }
# the RAM `ci` sizes build jobs and test threads for, cgroup limits included (no dependencies)
lcc-sysmem = { workspace = true }
# corpus download checksums
sha2 = { workspace = true }
# precompressed web bundle (`cargo xtask web`); pure Rust
flate2 = "1"
brotli = { version = "8", default-features = false, features = ["std"] }
# ci/quarantine.toml
toml = "1"
# `cargo xtask update-key`: the release's signed SHA256SUMS.txt
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
getrandom = "0.3"
# `cargo xtask android package`: assembling the APK / AAB (stored entries only: aapt2 compresses its own)
zip = { version = "7", default-features = false }
