[package]
name = "lcc-meta"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Metadata: EXIF, XMP, IPTC (L1)"

[lints]
workspace = true

[dependencies]
lcc-brand = { workspace = true }
lcc-tiff = { workspace = true }
lcc-geom = { workspace = true }
serde = { workspace = true }
quick-xml = { workspace = true }
chrono = { workspace = true }
# `brob` (Brotli-wrapped) JPEG XL metadata boxes
brotli-decompressor = { version = "5", default-features = false, features = ["std"] }

[dev-dependencies]
proptest = { workspace = true }
# tests record why they skip (`cargo xtask ci` lists the skips)
lcc-testkit = { workspace = true }
serde_json = { workspace = true }
# Lossless synthetic HEIF files for the container reader's tests.
lcc-heif = { workspace = true, features = ["testdata"] }
# Brotli-wrapped (`brob`) JPEG XL metadata boxes in test fixtures
brotli = { version = "8", default-features = false, features = ["std"] }
