[package]
name = "lcc-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP server (L5): JSON-RPC 2.0 over stdio, driving a running app or a headless session"

[lints]
workspace = true

[dependencies]
lcc-brand = { workspace = true }
lcc-engine = { workspace = true }
lcc-codecs = { workspace = true }
lcc-raster = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# reusable presets end to end (tests/e2e.rs): read the exported files' metadata back
lcc-meta = { workspace = true }

# M14: end-to-end video tests encode a synthetic clip in-test and re-decode the export
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies.lcc-video]
workspace = true
features = ["test-util"]
