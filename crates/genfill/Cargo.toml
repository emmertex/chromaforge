[package]
name = "lcc-genfill"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Generative fill: patches of the photo's own pixels (file format, compositing, matched sensor noise), the invertible send/receive transform, and (feature `cloud`) bring-your-own-key provider clients with a local mock server (L1)"

[lints]
workspace = true

[features]
default = []
# provider clients over HTTPS (lcc-fetch), API keys, the mock server; native only
cloud = ["dep:lcc-fetch", "dep:png"]

[dependencies]
lcc-color = { workspace = true }
lcc-raster = { workspace = true }
lcc-brand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
miniz_oxide = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lcc-fetch = { workspace = true, optional = true }
png = { workspace = true, optional = true }
